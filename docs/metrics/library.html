<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Library - NSWall Performance Metrics</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent-green: #238636;
            --accent-red: #da3633;
            --accent-yellow: #d29922;
            --accent-blue: #58a6ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        nav a {
            color: var(--accent-blue);
            text-decoration: none;
            margin-right: 20px;
        }

        h1 { font-size: 24px; font-weight: 600; }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            text-align: center;
        }

        .summary-value { font-size: 32px; font-weight: 600; }
        .summary-label { font-size: 12px; color: var(--text-secondary); }

        .filters {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-group label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        select, input, button {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 8px 12px;
            font-size: 14px;
        }

        button {
            cursor: pointer;
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        button:hover { opacity: 0.9; }

        .test-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .test-table th,
        .test-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .test-table th {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            background: var(--bg-tertiary);
        }

        .test-table tbody tr:hover { background: var(--bg-tertiary); }

        .test-table tbody tr:last-child td { border-bottom: none; }

        .test-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 500;
        }

        .category-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .category-badge.pf { background: #1f6feb33; color: #58a6ff; }
        .category-badge.tables { background: #238636; color: #fff; }
        .category-badge.ipsec { background: #8957e5; color: #fff; }
        .category-badge.bgp { background: #d29922; color: #000; }
        .category-badge.ospf { background: #da3633; color: #fff; }
        .category-badge.nats { background: #3fb950; color: #000; }

        .critical-badge {
            background: rgba(218, 54, 51, 0.3);
            color: #ff7b72;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            margin-left: 8px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-dot.passed { background: var(--accent-green); }
        .status-dot.warning { background: var(--accent-yellow); }
        .status-dot.failed { background: var(--accent-red); }
        .status-dot.no_data { background: var(--text-secondary); }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 { font-size: 18px; }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
        }

        .modal-body { padding: 16px; }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            border-color: var(--border-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Test Library</h1>
            </div>
            <nav>
                <a href="index.html">Dashboard</a>
                <a href="runs.html">Run History</a>
                <a href="upgrade.html">Upgrade Impact</a>
            </nav>
        </header>

        <div class="summary" id="summary"></div>

        <div class="filters">
            <div class="filter-group">
                <label>Category</label>
                <select id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="pf">PF (Packet Filter)</option>
                    <option value="tables">Tables</option>
                    <option value="ipsec">IPsec</option>
                    <option value="bgp">BGP</option>
                    <option value="ospf">OSPF</option>
                    <option value="nats">NATS</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Type</label>
                <select id="typeFilter">
                    <option value="all">All Types</option>
                    <option value="parse">Parse</option>
                    <option value="load">Load</option>
                    <option value="throughput">Throughput</option>
                    <option value="latency">Latency</option>
                    <option value="capacity">Capacity</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Status</label>
                <select id="statusFilter">
                    <option value="all">All</option>
                    <option value="critical">Critical Only</option>
                    <option value="enabled">Enabled Only</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Search</label>
                <input type="text" id="searchFilter" placeholder="Search tests...">
            </div>
            <div class="filter-group">
                <label>&nbsp;</label>
                <button onclick="showNewTestModal()">+ Request New Test</button>
            </div>
        </div>

        <table class="test-table">
            <thead>
                <tr>
                    <th>Test ID</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Type</th>
                    <th>Scale</th>
                    <th>Status</th>
                    <th>Last Value</th>
                </tr>
            </thead>
            <tbody id="testTable"></tbody>
        </table>
    </div>

    <!-- New Test Request Modal -->
    <div class="modal" id="newTestModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Request New Test Case</h2>
                <button class="modal-close" onclick="hideNewTestModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 16px; color: var(--text-secondary);">
                    Submit a request for a new performance test. This helps us ensure NSWall
                    upgrades don't affect your specific use case.
                </p>
                <form id="newTestForm">
                    <div class="form-group">
                        <label>Test Name *</label>
                        <input type="text" name="test_name" placeholder="e.g., PF Filter with 5000 source NAT rules" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Category *</label>
                            <select name="category" required>
                                <option value="">Select...</option>
                                <option value="pf">PF (Packet Filter)</option>
                                <option value="tables">Tables</option>
                                <option value="ipsec">IPsec</option>
                                <option value="bgp">BGP</option>
                                <option value="ospf">OSPF</option>
                                <option value="nats">NATS Controller</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Test Type *</label>
                            <select name="test_type" required>
                                <option value="">Select...</option>
                                <option value="parse">Parse Time</option>
                                <option value="load">Load Time</option>
                                <option value="throughput">Throughput</option>
                                <option value="latency">Latency</option>
                                <option value="capacity">Capacity</option>
                                <option value="memory">Memory Usage</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Scale/Count</label>
                            <input type="number" name="scale" placeholder="e.g., 5000">
                        </div>
                        <div class="form-group">
                            <label>Expected Unit</label>
                            <select name="unit">
                                <option value="ms">Milliseconds (ms)</option>
                                <option value="rate">Rate (/sec)</option>
                                <option value="count">Count</option>
                                <option value="KB">Kilobytes (KB)</option>
                                <option value="MB">Megabytes (MB)</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Description *</label>
                        <textarea name="description" placeholder="Describe what this test should measure and why it's important for your use case..." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Your Use Case</label>
                        <textarea name="use_case" placeholder="How are you using NSWall? What configuration sizes do you have?"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Contact Email</label>
                        <input type="email" name="email" placeholder="your@email.com">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-secondary" onclick="hideNewTestModal()">Cancel</button>
                        <button type="submit">Submit Request</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let libraryData = null;
        let metricsData = null;

        async function loadData() {
            try {
                const [libRes, metRes] = await Promise.all([
                    fetch('tests.json'),
                    fetch('metrics.json')
                ]);
                libraryData = await libRes.json();
                metricsData = await metRes.json();
                renderPage();
            } catch (error) {
                console.error('Failed to load data:', error);
            }
        }

        function renderPage() {
            // Summary
            const categories = libraryData.categories || {};
            document.getElementById('summary').innerHTML = `
                <div class="summary-card">
                    <div class="summary-value">${libraryData.total}</div>
                    <div class="summary-label">Total Tests</div>
                </div>
                ${Object.entries(categories).map(([cat, count]) => `
                    <div class="summary-card">
                        <div class="summary-value">${count}</div>
                        <div class="summary-label">${cat.toUpperCase()}</div>
                    </div>
                `).join('')}
            `;

            renderTable();
        }

        function renderTable() {
            const tests = filterTests(libraryData.tests || []);
            const metricsMap = {};
            (metricsData.tests || []).forEach(t => metricsMap[t.test_id] = t);

            const tbody = document.getElementById('testTable');
            tbody.innerHTML = tests.map(test => {
                const metric = metricsMap[test.test_id] || {};
                const status = metric.status || 'no_data';
                const currentValue = metric.current_value !== undefined
                    ? formatValue(metric.current_value, test.unit)
                    : '-';

                return `
                    <tr>
                        <td>
                            <a class="test-link" href="test.html?id=${test.test_id}">${test.test_id}</a>
                            ${test.critical ? '<span class="critical-badge">CRITICAL</span>' : ''}
                        </td>
                        <td>${test.test_name}</td>
                        <td><span class="category-badge ${test.category}">${test.category}</span></td>
                        <td>${test.test_type}</td>
                        <td>${test.scale || '-'}</td>
                        <td><span class="status-dot ${status}"></span>${status}</td>
                        <td>${currentValue}</td>
                    </tr>
                `;
            }).join('');
        }

        function filterTests(tests) {
            const category = document.getElementById('categoryFilter').value;
            const type = document.getElementById('typeFilter').value;
            const status = document.getElementById('statusFilter').value;
            const search = document.getElementById('searchFilter').value.toLowerCase();

            return tests.filter(test => {
                if (category !== 'all' && test.category !== category) return false;
                if (type !== 'all' && test.test_type !== type) return false;
                if (status === 'critical' && !test.critical) return false;
                if (status === 'enabled' && !test.enabled) return false;
                if (search && !test.test_id.toLowerCase().includes(search) &&
                    !test.test_name.toLowerCase().includes(search)) return false;
                return true;
            });
        }

        function formatValue(value, unit) {
            if (value === null || value === undefined) return '-';
            if (unit === 'ms') return `${value.toFixed(0)}ms`;
            if (unit === 'rate') return `${value.toFixed(0)}/s`;
            if (unit === 'count') return value.toLocaleString();
            return value.toFixed(2);
        }

        function showNewTestModal() {
            document.getElementById('newTestModal').classList.add('active');
        }

        function hideNewTestModal() {
            document.getElementById('newTestModal').classList.remove('active');
        }

        document.getElementById('newTestForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            // In production, this would submit to an API
            // For now, generate a GitHub issue URL
            const title = encodeURIComponent(`[Test Request] ${data.test_name}`);
            const body = encodeURIComponent(`
## New Test Case Request

**Test Name:** ${data.test_name}
**Category:** ${data.category}
**Type:** ${data.test_type}
**Scale:** ${data.scale || 'N/A'}
**Unit:** ${data.unit}

### Description
${data.description}

### Use Case
${data.use_case || 'Not provided'}

### Contact
${data.email || 'Not provided'}
            `);

            window.open(`https://github.com/northshorenetworks/NSWall/issues/new?title=${title}&body=${body}&labels=test-request`, '_blank');
            hideNewTestModal();
            alert('Redirecting to GitHub to create a test request issue...');
        });

        // Event listeners
        document.getElementById('categoryFilter').addEventListener('change', renderTable);
        document.getElementById('typeFilter').addEventListener('change', renderTable);
        document.getElementById('statusFilter').addEventListener('change', renderTable);
        document.getElementById('searchFilter').addEventListener('input', renderTable);

        loadData();
    </script>
</body>
</html>
