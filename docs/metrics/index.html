<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSWall Performance Metrics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent-green: #238636;
            --accent-red: #da3633;
            --accent-yellow: #d29922;
            --accent-blue: #58a6ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .last-updated {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
        }

        .card-title {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 32px;
            font-weight: 600;
        }

        .card-value.success { color: var(--accent-green); }
        .card-value.warning { color: var(--accent-yellow); }
        .card-value.failure { color: var(--accent-red); }

        .filters {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-group label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        select, input {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 8px 12px;
            font-size: 14px;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .test-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .test-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .test-name {
            font-weight: 600;
            font-size: 14px;
        }

        .test-status {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .test-status.passed { background: rgba(35, 134, 54, 0.2); color: var(--accent-green); }
        .test-status.warning { background: rgba(210, 153, 34, 0.2); color: var(--accent-yellow); }
        .test-status.failed { background: rgba(218, 54, 51, 0.2); color: var(--accent-red); }

        .test-card-body {
            padding: 16px;
        }

        .test-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .metric {
            text-align: center;
        }

        .metric-value {
            font-size: 18px;
            font-weight: 600;
        }

        .metric-label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .chart-container {
            height: 150px;
            position: relative;
        }

        .alerts-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .alert-list {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
        }

        .alert-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .alert-item:last-child {
            border-bottom: none;
        }

        .alert-icon {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .alert-icon.warning { background: var(--accent-yellow); }
        .alert-icon.failure { background: var(--accent-red); }

        .alert-message {
            flex: 1;
        }

        .alert-test {
            font-weight: 500;
        }

        .alert-detail {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .alert-time {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .trend-table {
            width: 100%;
            border-collapse: collapse;
        }

        .trend-table th,
        .trend-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .trend-table th {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
        }

        .trend-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .trend-up { color: var(--accent-red); }
        .trend-down { color: var(--accent-green); }
        .trend-flat { color: var(--text-secondary); }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .test-grid {
                grid-template-columns: 1fr;
            }

            .filters {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>NSWall Performance Metrics</h1>
            <span class="last-updated">Last updated: <span id="lastUpdated">-</span></span>
        </header>

        <div class="summary-cards">
            <div class="card">
                <div class="card-title">Total Tests</div>
                <div class="card-value" id="totalTests">-</div>
            </div>
            <div class="card">
                <div class="card-title">Passing</div>
                <div class="card-value success" id="passingTests">-</div>
            </div>
            <div class="card">
                <div class="card-title">Warnings</div>
                <div class="card-value warning" id="warningTests">-</div>
            </div>
            <div class="card">
                <div class="card-title">Failures</div>
                <div class="card-value failure" id="failureTests">-</div>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>Category</label>
                <select id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="pf">PF (Packet Filter)</option>
                    <option value="tables">Tables</option>
                    <option value="ipsec">IPsec</option>
                    <option value="bgp">BGP</option>
                    <option value="ospf">OSPF</option>
                    <option value="nats">NATS</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Branch</label>
                <select id="branchFilter">
                    <option value="main">main</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Time Range</label>
                <select id="timeFilter">
                    <option value="7">Last 7 days</option>
                    <option value="30" selected>Last 30 days</option>
                    <option value="90">Last 90 days</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Search</label>
                <input type="text" id="searchFilter" placeholder="Search tests...">
            </div>
        </div>

        <div class="alerts-section" id="alertsSection" style="display: none;">
            <h2 class="section-title">Recent Alerts</h2>
            <div class="alert-list" id="alertList"></div>
        </div>

        <h2 class="section-title">Test Results</h2>
        <div class="test-grid" id="testGrid"></div>

        <h2 class="section-title">Trend Summary</h2>
        <div class="card">
            <table class="trend-table">
                <thead>
                    <tr>
                        <th>Test</th>
                        <th>Current</th>
                        <th>Baseline</th>
                        <th>Change</th>
                        <th>Trend</th>
                    </tr>
                </thead>
                <tbody id="trendTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Global data store
        let metricsData = null;

        // Load metrics data
        async function loadMetrics() {
            try {
                const response = await fetch('metrics.json');
                metricsData = await response.json();
                renderDashboard();
            } catch (error) {
                console.error('Failed to load metrics:', error);
                document.getElementById('testGrid').innerHTML =
                    '<div class="no-data">Failed to load metrics data</div>';
            }
        }

        // Render the dashboard
        function renderDashboard() {
            if (!metricsData) return;

            // Update last updated time
            document.getElementById('lastUpdated').textContent =
                new Date(metricsData.generated_at).toLocaleString();

            // Update summary cards
            const summary = metricsData.summary || {};
            document.getElementById('totalTests').textContent = summary.total || 0;
            document.getElementById('passingTests').textContent = summary.passed || 0;
            document.getElementById('warningTests').textContent = summary.warnings || 0;
            document.getElementById('failureTests').textContent = summary.failures || 0;

            // Render alerts
            renderAlerts();

            // Render test cards
            renderTestCards();

            // Render trend table
            renderTrendTable();
        }

        // Render alerts section
        function renderAlerts() {
            const alerts = metricsData.alerts || [];
            const alertsSection = document.getElementById('alertsSection');
            const alertList = document.getElementById('alertList');

            if (alerts.length === 0) {
                alertsSection.style.display = 'none';
                return;
            }

            alertsSection.style.display = 'block';
            alertList.innerHTML = alerts.slice(0, 10).map(alert => `
                <div class="alert-item">
                    <div class="alert-icon ${alert.severity}"></div>
                    <div class="alert-message">
                        <div class="alert-test">${alert.test_id}</div>
                        <div class="alert-detail">${alert.message}</div>
                    </div>
                    <div class="alert-time">${formatRelativeTime(alert.timestamp)}</div>
                </div>
            `).join('');
        }

        // Render test cards with charts
        function renderTestCards() {
            const tests = filterTests(metricsData.tests || []);
            const grid = document.getElementById('testGrid');

            if (tests.length === 0) {
                grid.innerHTML = '<div class="no-data">No tests match your filters</div>';
                return;
            }

            grid.innerHTML = tests.map(test => `
                <div class="test-card" data-test-id="${test.test_id}">
                    <div class="test-card-header">
                        <span class="test-name">${test.test_name || test.test_id}</span>
                        <span class="test-status ${test.status}">${test.status}</span>
                    </div>
                    <div class="test-card-body">
                        <div class="test-metrics">
                            <div class="metric">
                                <div class="metric-value">${formatValue(test.current_value, test.unit)}</div>
                                <div class="metric-label">Current</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value">${formatValue(test.baseline_mean, test.unit)}</div>
                                <div class="metric-label">Baseline</div>
                            </div>
                            <div class="metric">
                                <div class="metric-value ${getChangeClass(test.deviation_pct)}">${formatChange(test.deviation_pct)}</div>
                                <div class="metric-label">Change</div>
                            </div>
                        </div>
                        <div class="chart-container">
                            <canvas id="chart-${test.test_id.replace(/\./g, '-')}"></canvas>
                        </div>
                    </div>
                </div>
            `).join('');

            // Create charts
            tests.forEach(test => {
                createChart(test);
            });
        }

        // Create a trend chart for a test
        function createChart(test) {
            const canvasId = `chart-${test.test_id.replace(/\./g, '-')}`;
            const canvas = document.getElementById(canvasId);
            if (!canvas || !test.history) return;

            const ctx = canvas.getContext('2d');
            const data = test.history.map((h, i) => ({
                x: new Date(h.timestamp),
                y: h.value
            }));

            new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: test.unit,
                        data: data,
                        borderColor: '#58a6ff',
                        backgroundColor: 'rgba(88, 166, 255, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 2,
                        pointHoverRadius: 5
                    }, {
                        label: 'Baseline',
                        data: data.map(d => ({ x: d.x, y: test.baseline_mean })),
                        borderColor: '#8b949e',
                        borderDash: [5, 5],
                        pointRadius: 0,
                        fill: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => `${ctx.parsed.y.toFixed(2)} ${test.unit}`
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            display: false
                        },
                        y: {
                            display: true,
                            grid: { color: '#30363d' },
                            ticks: { color: '#8b949e' }
                        }
                    }
                }
            });
        }

        // Render trend table
        function renderTrendTable() {
            const tests = filterTests(metricsData.tests || []);
            const tbody = document.getElementById('trendTable');

            tbody.innerHTML = tests.map(test => `
                <tr>
                    <td>${test.test_id}</td>
                    <td>${formatValue(test.current_value, test.unit)}</td>
                    <td>${formatValue(test.baseline_mean, test.unit)}</td>
                    <td class="${getChangeClass(test.deviation_pct)}">${formatChange(test.deviation_pct)}</td>
                    <td>${getTrendIndicator(test.trend)}</td>
                </tr>
            `).join('');
        }

        // Filter tests based on current filters
        function filterTests(tests) {
            const category = document.getElementById('categoryFilter').value;
            const search = document.getElementById('searchFilter').value.toLowerCase();

            return tests.filter(test => {
                if (category !== 'all' && test.category !== category) return false;
                if (search && !test.test_id.toLowerCase().includes(search) &&
                    !(test.test_name || '').toLowerCase().includes(search)) return false;
                return true;
            });
        }

        // Utility functions
        function formatValue(value, unit) {
            if (value === null || value === undefined) return '-';
            if (unit === 'ms') return `${value.toFixed(0)}ms`;
            if (unit === 'rate') return `${value.toFixed(0)}/s`;
            if (unit === 'count') return value.toLocaleString();
            if (unit === 'KB') return `${value.toFixed(0)}KB`;
            return value.toFixed(2);
        }

        function formatChange(pct) {
            if (pct === null || pct === undefined) return '-';
            const sign = pct > 0 ? '+' : '';
            return `${sign}${pct.toFixed(1)}%`;
        }

        function getChangeClass(pct) {
            if (pct === null || pct === undefined) return '';
            if (pct > 15) return 'trend-up';
            if (pct > 5) return 'warning';
            if (pct < -5) return 'trend-down';
            return 'trend-flat';
        }

        function getTrendIndicator(trend) {
            if (!trend || trend === 'flat') return '<span class="trend-indicator trend-flat">→</span>';
            if (trend === 'up') return '<span class="trend-indicator trend-up">↑ Slower</span>';
            if (trend === 'down') return '<span class="trend-indicator trend-down">↓ Faster</span>';
            return '-';
        }

        function formatRelativeTime(timestamp) {
            const now = new Date();
            const then = new Date(timestamp);
            const diff = now - then;
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(hours / 24);

            if (days > 0) return `${days}d ago`;
            if (hours > 0) return `${hours}h ago`;
            return 'just now';
        }

        // Event listeners
        document.getElementById('categoryFilter').addEventListener('change', renderDashboard);
        document.getElementById('branchFilter').addEventListener('change', loadMetrics);
        document.getElementById('timeFilter').addEventListener('change', loadMetrics);
        document.getElementById('searchFilter').addEventListener('input', renderDashboard);

        // Initial load
        loadMetrics();
    </script>
</body>
</html>
