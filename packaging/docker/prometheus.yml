global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Controller metrics
  - job_name: 'nswall-controller'
    static_configs:
      - targets: ['controller:8080']
    metrics_path: '/api/v1/metrics'

  # NSWall agents (discovered via controller API)
  - job_name: 'nswall-agents'
    http_sd_configs:
      - url: 'http://controller:8080/api/v1/agents/prometheus-targets'
        refresh_interval: 30s
