!
! NSWall Default Configuration
! Generated by install.site
!
hostname nswall
!
! Interface configuration
interface em0
 description "WAN Interface"
 ip dhcp
!
interface em1
 description "LAN Interface"
 ip address 192.168.1.1/24
!
! Enable IP forwarding
sysctl net.inet.ip.forwarding=1
sysctl net.inet6.ip6.forwarding=1
!
! PF Firewall Configuration
pf enable
!
pf rules
! Tables
table <bruteforce> persist
table <martians> const { 0.0.0.0/8 10.0.0.0/8 127.0.0.0/8 169.254.0.0/16 \
  172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 \
  198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 }
!
! Options
set skip on lo
set block-policy drop
set loginterface em0
set optimization normal
!
! Scrub
match in all scrub (no-df random-id max-mss 1440)
!
! NAT
match out on em0 inet from !(em0:network) to any nat-to (em0:0)
!
! Default deny
block in log all
block out log all
!
! Anti-spoofing
antispoof quick for { lo em1 }
block in quick on em0 from <martians>
block out quick on em0 to <martians>
block quick from <bruteforce>
!
! Allow ICMP
pass in on em0 inet proto icmp all icmp-type echoreq
pass out inet proto icmp all
!
! Allow outbound
pass out on em0 proto { tcp udp } all modulate state
!
! Allow LAN
pass in on em1 from (em1:network) to any keep state
!
! Management access (HTTPS, SSH) from LAN only
pass in on em1 proto tcp from (em1:network) to (em1) port 443 keep state
pass in on em1 proto tcp from (em1:network) to (em1) port 22 \
  keep state (max-src-conn 10, max-src-conn-rate 5/60, \
  overload <bruteforce> flush global)
!
.
!
! DHCP server for LAN
dhcp enable em1
dhcp range em1 192.168.1.100 192.168.1.199
dhcp option em1 routers 192.168.1.1
dhcp option em1 domain-name-servers 192.168.1.1
dhcp option em1 lease-time 86400
!
! DNS resolver
unwind enable
unwind forwarder 1.1.1.1
unwind forwarder 8.8.8.8
!
! NTP
ntpd enable
ntpd servers pool.ntp.org
!
! Logging
syslog *.notice /var/log/messages
syslog local0.* /var/log/nswall.log
!
