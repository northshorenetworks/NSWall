name: NSWall Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.0.0)'
        required: true
        type: string

jobs:
  build-release:
    name: Build Release on OpenBSD
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['7.6']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build release on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.version }}
          usesh: true
          prepare: |
            pkg_add gmake
          run: |
            echo "=== Building NSWall Release ==="
            uname -a

            # Build nssh
            cd nssh
            if [ -f Makefile ]; then
              make clean || true
              make || echo "Note: Full build requires OpenBSD source tree"
            fi

            # Create release artifacts
            cd ..
            mkdir -p release

            # Package source
            tar czf release/nswall-src.tar.gz \
              --exclude='.git' \
              --exclude='release' \
              nssh/ initial-conf/ packages/ PLATFORM/ tools/ \
              Makefile build-*.sh LICENSE README

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nswall-release-openbsd-${{ matrix.version }}
          path: release/
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
