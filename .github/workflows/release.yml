name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.0.0)'
        required: true
        type: string

jobs:
  build-release:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            release: '7.8'
          - arch: aarch64
            release: '7.8'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          usesh: true
          prepare: |
            pkg_add sqlite3 go
          run: |
            set -e
            VERSION="${{ steps.version.outputs.version }}"
            ARCH=$(uname -m)

            # Build shell
            make clean || true
            make
            make install DESTDIR=/tmp/pkg PREFIX=/usr/local

            # Build API
            cd api
            go mod download || true
            make build
            make install DESTDIR=/tmp/pkg PREFIX=/usr/local
            cd ..

            cd /tmp/pkg
            TARBALL="nswall-${VERSION}-openbsd-${ARCH}.tgz"
            tar czf ~/${TARBALL} .
            cp ~/${TARBALL} ~/work/NSWall/NSWall/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nswall-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          path: "*.tgz"
          if-no-files-found: ignore

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: NSWall v${{ github.ref_name }}
          body: |
            ## NSWall ${{ github.ref_name }}

            Based on NSH (Network Shell) by Chris Cappuccio.

            ### Installation

            ```bash
            # Download for your architecture
            curl -LO <package-url>

            # Extract
            doas tar xzf nswall-*.tgz -C /

            # Set as shell
            doas sh -c 'echo /usr/local/bin/nsh >> /etc/shells'
            chsh -s /usr/local/bin/nsh
            ```

            ### Requirements
            - OpenBSD 7.6+ (7.8 recommended)
            - sqlite3 package: `pkg_add sqlite3`

          files: packages/*.tgz
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
