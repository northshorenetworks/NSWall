name: Build and Test

on:
  push:
    branches: [ main, master, 'claude/*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-openbsd:
    name: Build on OpenBSD ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['7.8', '7.6']
        arch: ['x86_64']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          prepare: |
            pkg_add -u
          run: |
            set -e
            echo "==> OpenBSD $(uname -r) on $(uname -m)"
            echo "==> Building NSWall..."

            cd nssh

            # Generate compile.c
            sh misc-precompile.sh || true
            sh compile.sh

            # Build
            make clean || true
            make CFLAGS="-O2 -pipe -Wall"

            # Verify binary was created
            if [ -f nsh ]; then
              echo "==> Build successful!"
              ls -la nsh
              file nsh
            else
              echo "==> Build failed!"
              exit 1
            fi

            # Basic smoke test
            echo "==> Running smoke test..."
            ./nsh -c "show version" || echo "Smoke test skipped (needs tty)"

            echo "==> All tests passed!"

  build-openbsd-arm64:
    name: Build on OpenBSD (ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build on OpenBSD ARM64
        uses: vmactions/openbsd-vm@v1
        with:
          release: '7.8'
          arch: aarch64
          usesh: true
          run: |
            set -e
            echo "==> OpenBSD $(uname -r) on $(uname -m)"
            echo "==> Building NSWall for ARM64..."

            cd nssh
            sh misc-precompile.sh || true
            sh compile.sh
            make clean || true
            make CFLAGS="-O2 -pipe -Wall"

            if [ -f nsh ]; then
              echo "==> ARM64 build successful!"
              file nsh
            else
              echo "==> ARM64 build failed!"
              exit 1
            fi

  package:
    name: Create Package
    runs-on: ubuntu-latest
    needs: build-openbsd
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build package on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          release: '7.8'
          usesh: true
          sync: rsync
          run: |
            set -e
            echo "==> Creating NSWall package..."

            # Build
            cd nssh
            sh misc-precompile.sh || true
            sh compile.sh
            make clean || true
            make CFLAGS="-O2 -pipe -Wall"

            # Create package directory
            cd ..
            VERSION="2.0.0"
            PKGDIR="/tmp/nswall-pkg"
            mkdir -p ${PKGDIR}/usr/local/bin
            mkdir -p ${PKGDIR}/usr/local/share/nswall/pf
            mkdir -p ${PKGDIR}/usr/local/share/examples/nswall
            mkdir -p ${PKGDIR}/etc/nswall

            # Install files
            cp nssh/nsh ${PKGDIR}/usr/local/bin/nswall
            chmod 555 ${PKGDIR}/usr/local/bin/nswall
            cp nssh/tcpdump/nstcpd ${PKGDIR}/usr/local/bin/
            chmod 555 ${PKGDIR}/usr/local/bin/nstcpd
            cp nssh/save-rw.sh ${PKGDIR}/usr/local/bin/nswall-save
            chmod 555 ${PKGDIR}/usr/local/bin/nswall-save
            cp nssh/pf/pf.subr ${PKGDIR}/usr/local/share/nswall/pf/
            cp nssh/pf/*.sh ${PKGDIR}/usr/local/share/nswall/pf/
            cp pkg/files/nswall.conf.sample ${PKGDIR}/usr/local/share/examples/nswall/
            cp pkg/files/nswall.conf.sample ${PKGDIR}/etc/nswall/nswall.conf

            # Create tarball
            cd ${PKGDIR}
            tar czf /tmp/nswall-${VERSION}-$(uname -m).tgz .
            cp /tmp/nswall-${VERSION}-$(uname -m).tgz ~/work/NSWall/NSWall/

            echo "==> Package created!"
            ls -la ~/work/NSWall/NSWall/*.tgz

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nswall-package-amd64
          path: "*.tgz"
          retention-days: 30

  # Fast syntax/lint check (runs on Linux, no VM needed)
  lint:
    name: Lint and Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          echo "==> Checking shell scripts..."
          find . -name "*.sh" -type f | head -20 | while read f; do
            echo "Checking: $f"
            bash -n "$f" 2>&1 || echo "Warning: $f has issues"
          done

      - name: Check for common issues
        run: |
          echo "==> Checking for hardcoded secrets..."
          # Check for obvious password patterns (but allow the existing EPASS for now)
          if grep -r "password.*=.*['\"]" --include="*.c" --include="*.h" | grep -v EPASS | grep -v "// "; then
            echo "Warning: Possible hardcoded passwords found"
          fi

          echo "==> Checking for TODO/FIXME/XXX..."
          grep -rn "TODO\|FIXME\|XXX" --include="*.c" --include="*.h" || echo "None found"
