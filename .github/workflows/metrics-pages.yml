name: Metrics Dashboard

on:
  # Runs after stress tests complete
  workflow_run:
    workflows: ["Stress Tests"]
    types: [completed]

  # Allow manual trigger
  workflow_dispatch:

  # Update daily
  schedule:
    - cron: '0 6 * * *'

# Sets permissions for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Metrics Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download Metrics Database
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: stress-tests.yml
          name: metrics-database
          path: /tmp/metrics
        continue-on-error: true

      - name: Build Site Generator
        run: |
          cd tests/metrics
          go mod init metrics-site-generator 2>/dev/null || true
          go get github.com/mattn/go-sqlite3
          go build -o generate-site generate-site.go

      - name: Initialize Database if Missing
        run: |
          if [ ! -f /tmp/metrics/metrics.db ]; then
            echo "No metrics database found, creating empty one..."
            mkdir -p /tmp/metrics
            cd tests/metrics
            sqlite3 /tmp/metrics/metrics.db < schema.sql
          fi

      - name: Generate Static Site
        run: |
          cd tests/metrics
          ./generate-site -db /tmp/metrics/metrics.db -output ../../docs/metrics -days 90

      - name: List Generated Files
        run: |
          echo "Generated files:"
          find docs/metrics -type f | head -50
          echo ""
          echo "Test count:"
          cat docs/metrics/tests.json | jq '.total' 2>/dev/null || echo "N/A"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs/metrics
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: failure()

    steps:
      - name: Create Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Metrics Dashboard Deployment Failed';
            const body = `
            The metrics dashboard deployment failed.

            - Workflow: ${context.workflow}
            - Run: ${context.runId}
            - [View Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            Please investigate and fix the deployment.
            `;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure'
            });

            const existingIssue = issues.data.find(i => i.title === title);
            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['ci-failure', 'metrics']
              });
            }
